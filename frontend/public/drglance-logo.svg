<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="glance-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glance-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <radialGradient id="glance-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Halo -->
  <circle cx="32" cy="32" r="30" fill="url(#glance-halo)" />

  <!-- Outer Telemetry Calibration Ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#glance-cyan)" stroke-width="1.5" stroke-opacity="0.35" />
  
  <!-- Outer Calibration Ticks (8 Cardinals) -->
  <line x1="32" y1="2" x2="32" y2="5" stroke="url(#glance-cyan)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="59" x2="32" y2="62" stroke="url(#glance-cyan)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="2" y1="32" x2="5" y2="32" stroke="url(#glance-cyan)" stroke-width="1.5" stroke-linecap="round" />
  <line x1="59" y1="32" x2="62" y2="32" stroke="url(#glance-cyan)" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="11" cy="11" r="1" fill="#38bdf8" opacity="0.6" />
  <circle cx="53" cy="11" r="1" fill="#38bdf8" opacity="0.6" />
  <circle cx="11" cy="53" r="1" fill="#38bdf8" opacity="0.6" />
  <circle cx="53" cy="53" r="1" fill="#38bdf8" opacity="0.6" />

  <!-- Biometric Iris Aperture Ring (Dashed Orbital Track) -->
  <circle cx="32" cy="32" r="22" stroke="url(#glance-cyan)" stroke-width="1.75" stroke-dasharray="8 4 2 4" stroke-linecap="round" opacity="0.85" />

  <!-- Inner High-Precision Reticle -->
  <circle cx="32" cy="32" r="14" stroke="#ffffff" stroke-width="1.25" stroke-opacity="0.25" />

  <!-- Clinical Intersection Cross (Medical Biometrics) -->
  <path d="M32 18 V46 M18 32 H46" stroke="url(#glance-cyan)" stroke-width="1.5" stroke-linecap="round" opacity="0.4" />

  <!-- Central Medical Cross Core -->
  <path d="M30 25 H34 V30 H39 V34 H34 V39 H30 V34 H25 V30 H30 Z" fill="url(#glance-cyan)" />

  <!-- Central Laser Pulse Pip -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" />
  <circle cx="32" cy="32" r="1" fill="#090a0f" />
</svg>
